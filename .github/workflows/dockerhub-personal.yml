name: Publish personal Docker Hub image

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # Weekly rebuild so the bundled yt-dlp stays current
    - cron: '0 8 * * 1'

concurrency:
  group: dockerhub-personal
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: doctorbeefy/muse

jobs:
  publish:
    name: Build and push
    if: github.repository_owner != 'museofficial'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get current time
        id: current-time
        shell: bash
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          # Skip the layer cache on scheduled runs so yt-dlp is reinstalled fresh
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
          build-args: |
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ steps.current-time.outputs.time }}
